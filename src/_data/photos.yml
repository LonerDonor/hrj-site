# Photographs for the /photos/ gallery (src/photos/index.njk).
# Owned by the Photos page. Other templates may read it — guard with {% if photos %}.
#
# One entry per photograph, in the order they appear on the page.
#
#   src       Required. /assets/images/photos/<category>/<file-name>.jpg
#             The file lives in src/assets/images/photos/<category>/.
#             Entries whose file doesn't exist yet are simply left out (the
#             build never breaks). /photos/, its menu item and the home page
#             strip appear once the first file exists.
#   alt       Required. What the photograph shows, in one plain sentence, for
#             people who can't see it. Describe the photo, not the subject's history.
#   caption   Required. Short title under the photo. Up to ~28 characters stays
#             on one line on wide screens (the full text shows in the viewer).
#   place     Where it was taken, e.g. "Patan Durbar Square". Keep it short.
#   year      Optional. The year it was taken, e.g. 2024. Leave it out if unsure.
#   category  Required. One of: water | heritage | walks | robotics | portfolio
#   shape     Optional tile shape on the page:
#               (leave out)  normal tile — landscape photos
#               tall         portrait (vertical) photos — twice as tall
#               large        a favourite landscape photo — twice as wide and tall
#               wide         panoramas — twice as wide, same height
#   focus     Optional. Which part to keep when a tile crops the photo:
#             top | bottom | left | right   (centre is the default)
#   featured  Optional. true → used as the page's social-share image (first one wins).
#   home      Optional. true → shown in the home page strip (up to 6; without
#             any `home: true`, the first 6 photos that exist are used).
#
# The entries below are SLOTS, listed on the page only once their file is
# added (plates are numbered in order of the photos that exist). When you add a photo, rewrite alt / caption / place so they describe
# the photograph you actually used, and add a year only if you know it.
# The shapes are arranged so the grid packs without gaps (2, 3 and 4 columns):
#   large, tall, tall, wide, wide, tall, tall, large, then four normal tiles.
# If you change shapes, check the page still looks even.

